<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekap Pembayaran</title><style>body{font-family:system-ui;margin:0;background:#f5f7f6;color:#17231d}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;padding:18px;border-radius:14px;border:1px solid #e3e9e5}.btn{border:0;border-radius:9px;padding:10px 14px;background:#0b5d3b;color:#fff;cursor:pointer}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.input{padding:10px;border:1px solid #ccd7d0;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f1f5f2}.muted{color:#68756e}.scroll{overflow:auto}</style></head><body><div class="wrap"><div class="toolbar"><a href="index.html">← Dashboard</a><button class="btn" id="load">Muat Rekap</button><button class="btn" id="csv">Download CSV</button></div><div class="card"><h1>Rekap Pembayaran</h1><p class="muted" id="msg">Login Dashboard diperlukan.</p><div class="scroll"><table><thead><tr><th>Tanggal</th><th>Order</th><th>Nama Siswa</th><th>Unit</th><th>Status</th><th>Nominal</th><th>Keterangan</th><th>Gateway</th></tr></thead><tbody id="body"></tbody></table></div></div></div><script src="config.js"></script><script>
let rows=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){try{const s=JSON.parse(localStorage.getItem('supabase_session')||'null');if(!s?.access_token)throw new Error('Silakan login Dashboard.');const r=await fetch(`${SUPABASE_URL}/functions/v1/payment-report`,{headers:{Authorization:`Bearer ${s.access_token}`,apikey:SUPABASE_KEY}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal memuat.');rows=d.rows||[];$('body').innerHTML=rows.map(x=>`<tr><td>${esc(x.created_at?.slice(0,16).replace('T',' '))}</td><td>${esc(x.order_id)}</td><td>${esc(x.student_name)}</td><td>${esc(x.unit)}</td><td>${esc(x.payment_status)}</td><td>Rp ${Number(x.amount||0).toLocaleString('id-ID')}</td><td>${esc(x.description)}</td><td>${esc(x.gateway_status)}</td></tr>`).join('');$('msg').textContent=`${rows.length} transaksi.`;}catch(e){$('msg').textContent=e.message;}}
function csv(){if(!rows.length)return;const head=['Tanggal','Order ID','Nama Siswa','Unit','Status','Nominal','Keterangan','Gateway'];const val=x=>String(x??'').replaceAll('"','""');const lines=[head,...rows.map(x=>[x.created_at,x.order_id,x.student_name,x.unit,x.payment_status,x.amount,x.description,x.gateway_status])].map(r=>r.map(v=>`"${val(v)}"`).join(','));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='rekap-pembayaran.csv';a.click();URL.revokeObjectURL(a.href)}$('load').onclick=load;$('csv').onclick=csv;load();
</script></body></html>
