<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekap Saran & Masukan</title><style>body{font:15px system-ui;margin:0;background:#f5f7f6}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e3e9e5;padding:18px;border-radius:14px}.btn{border:0;border-radius:8px;padding:8px;background:#0b5d3b;color:#fff;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.scroll{overflow:auto}</style></head><body><main class="wrap"><a href="index.html">← Dashboard</a><div class="card"><h1>Rekap Saran & Masukan</h1><p id="msg">Memuat…</p><button class="btn" id="csv">Download CSV</button><div class="scroll"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Saran</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="config.js"></script><script>const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let data=[];async function api(action,extra={}){const s=JSON.parse(localStorage.getItem('supabase_session')||'null');if(!s?.access_token)throw Error('Silakan login dashboard.');const r=await fetch(`${SUPABASE_URL}/functions/v1/feedback-admin`,{method:'POST',headers:{'content-type':'application/json',apikey:SUPABASE_KEY,authorization:`Bearer ${s.access_token}`},body:JSON.stringify({action,...extra})}),d=await r.json();if(!r.ok)throw Error(d.error||'Gagal memproses.');return d}async function load(){try{data=(await api('list')).rows;$('rows').innerHTML=data.map(x=>`<tr><td>${esc(x.created_at.replace('T',' ').slice(0,16))}</td><td>${esc(x.sender_name||'-')}</td><td>${esc(x.message)}</td><td><select onchange="updateFeedbackStatus('${x.id}',this.value)"><option ${x.status==='belum_dibaca'?'selected':''}>belum_dibaca</option><option ${x.status==='sudah_dibaca'?'selected':''}>sudah_dibaca</option><option ${x.status==='sudah_ditangani'?'selected':''}>sudah_ditangani</option></select></td></tr>`).join('');$('msg').textContent=`${data.length} saran.`}catch(e){$('msg').textContent=e.message}}window.updateFeedbackStatus=async(id,status)=>{try{await api('status',{id,status});await load()}catch(e){alert(e.message);await load()}};$('csv').onclick=()=>{const h=['ID','Tanggal','Nama','Saran','Status'],q=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv=[h,...data.map(x=>[x.id,x.created_at,x.sender_name,x.message,x.status])].map(r=>r.map(q).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='rekap-saran-masukan.csv';a.click()};load();</script></body></html>
